<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsightFlow 数据智能 Agent 平台</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1f2329;
  }
  header {
    padding: 14px 20px; background: #fff; border-bottom: 1px solid #e5e6eb;
    font-weight: 600; font-size: 15px;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 72%; padding: 10px 14px; border-radius: 10px;
    line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .user .bubble { background: #3370ff; color: #fff; }
  .assistant .bubble { background: #fff; border: 1px solid #e5e6eb; }
  .bubble.error { background: #fff1f0; border: 1px solid #ffccc7; color: #a8071a; }
  footer {
    padding: 14px 20px; background: #fff; border-top: 1px solid #e5e6eb;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1; resize: none; padding: 10px 12px; font: inherit; font-size: 14px;
    border: 1px solid #d0d3d9; border-radius: 8px; outline: none;
    height: 44px; max-height: 140px;
  }
  #input:focus { border-color: #3370ff; }
  button {
    padding: 0 20px; font: inherit; font-size: 14px; font-weight: 500;
    border: none; border-radius: 8px; background: #3370ff; color: #fff; cursor: pointer;
  }
  button:disabled { background: #a8c0ff; cursor: not-allowed; }
</style>
</head>
<body>
  <header>InsightFlow 数据智能 Agent 平台</header>
  <div id="messages"></div>
  <footer>
    <textarea id="input" placeholder="输入问题，Enter 发送 / Shift+Enter 换行" autofocus></textarea>
    <button id="send">发送</button>
  </footer>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');

const history = [];

function append(role, text, isError) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isError ? ' error' : '');
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendEl.disabled) return;

  inputEl.value = '';
  append('user', text);
  history.push({ role: 'user', content: text });

  sendEl.disabled = true;
  const pending = append('assistant', '思考中…');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '请求失败');

    pending.textContent = data.reply;
    history.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    pending.classList.add('error');
    pending.textContent = '出错了：' + err.message;
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
